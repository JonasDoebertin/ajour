name: Feature request
description: Suggest something Ajour should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Ajour help?
