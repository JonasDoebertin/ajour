name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/check-site.py
      - scripts/clock.test.mjs
      - scripts/appcast.py
      - scripts/appcast_test.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - scripts/check-site.py
      - scripts/clock.test.mjs
      - scripts/appcast.py
      - scripts/appcast_test.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the website
        run: python3 -I scripts/check-site.py site
      - name: Test the menu bar clock
        run: node --test scripts/clock.test.mjs
      - name: Test the update feed builder
        run: python3 -I scripts/appcast_test.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Copy the website
        run: |
          mkdir -p build/pages
          cp -R site/. build/pages
      - name: Build the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -eu
          work="$RUNNER_TEMP/feed"
          mkdir -p "$work"

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is empty, deploying without an update feed"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$work/release.json"; then
            echo "::warning::No published release, deploying without an update feed"
            exit 0
          fi
          tag=$(jq -r .tag_name "$work/release.json")
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern Ajour.zip --dir "$work"; then
            echo "::warning::Release $tag has no Ajour.zip, deploying without an update feed"
            exit 0
          fi
          jq -r '.body // ""' "$work/release.json" \
            | gh api markdown -F text=@- -f mode=gfm -f context="$GITHUB_REPOSITORY" > "$work/notes.html"

          key_file="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file")

          status=0
          python3 -I scripts/appcast.py \
            --release "$work/release.json" \
            --notes "$work/notes.html" \
            --archive "$work/Ajour.zip" \
            --key-file "$key_file" \
            --output build/pages/appcast.xml || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::Release $tag has no Sparkle update key, deploying without an update feed"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v5
