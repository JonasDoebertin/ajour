name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/check-site.py
      - scripts/clock.test.mjs
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - scripts/check-site.py
      - scripts/clock.test.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the website
        run: python3 -I scripts/check-site.py site
      - name: Test the menu bar clock
        run: node --test scripts/clock.test.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
