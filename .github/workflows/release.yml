name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo "::error::Release tags look like v1.2.3, but got $TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test

      - id: build
        uses: ./.github/actions/build
        with:
          version: ${{ steps.tag.outputs.version }}
          build-number: ${{ github.run_number }}
          archive-name: Ajour-${{ steps.tag.outputs.version }}

      # A rerun replaces the build on the existing draft instead of failing.
      - name: Attach the build to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --draft --verify-tag --generate-notes --title "Ajour $VERSION"
          fi
