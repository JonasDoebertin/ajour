name: Release

# A version tag attaches the signed and notarized build to a draft release. A manual run goes through the same
# signing and notarization on any branch and keeps the zip as a workflow artifact instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}

env:
  TEAM_ID: KA74RG7337

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo "::error::Release tags look like v1.2.3, but got $TAG."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/test

      - id: certificate
        uses: ./.github/actions/install-certificate
        with:
          certificate: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          password: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}

      - id: build
        uses: ./.github/actions/build
        with:
          version: ${{ steps.tag.outputs.version }}
          build-number: ${{ github.run_number }}
          archive-name: ${{ github.ref_type == 'tag' && 'Ajour' || format('Ajour-run{0}', github.run_number) }}
          team-id: ${{ env.TEAM_ID }}

      - uses: ./.github/actions/notarize
        with:
          app: ${{ steps.build.outputs.app }}
          archive: ${{ steps.build.outputs.archive }}
          team-id: ${{ env.TEAM_ID }}
          api-key: ${{ secrets.NOTARY_API_KEY }}
          api-key-id: ${{ secrets.NOTARY_API_KEY_ID }}
          api-issuer-id: ${{ secrets.NOTARY_API_ISSUER_ID }}

      # The website signs update feeds only for archives with this provenance.
      - name: Attest the build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      # A rerun replaces the build on the existing draft instead of failing.
      - name: Attach the build to a draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --draft --verify-tag --generate-notes --title "Ajour $VERSION"
          fi

      - name: Keep the build as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive }}
          archive: false
          retention-days: 14

      - name: Delete the signing keychain
        if: always() && steps.certificate.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.certificate.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
