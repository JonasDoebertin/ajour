name: Submit for notarization
description: Submits a file to Apple's notary service, waits for the result, and fails unless Apple accepts it.

inputs:
  file:
    description: Path of the zip, disk image or package to submit
    required: true
  subject:
    description: What the file holds, used in error messages, for example "the app"
    required: true
  api-key:
    description: App Store Connect API key as a base64-encoded .p8
    required: true
  api-key-id:
    description: ID of the API key
    required: true
  api-issuer-id:
    description: Issuer ID of the API key
    required: true

runs:
  using: composite
  steps:
    - name: Notarize ${{ inputs.subject }}
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        SUBJECT: ${{ inputs.subject }}
        API_KEY: ${{ inputs.api-key }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_ISSUER_ID: ${{ inputs.api-issuer-id }}
      run: |
        key="$RUNNER_TEMP/notary-key.p8"
        trap 'rm -f "$key"' EXIT
        base64 --decode <<< "$API_KEY" > "$key"
        credentials=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")

        submission="$(xcrun notarytool submit "$FILE" "${credentials[@]}" --wait --timeout 1h --output-format json)" || true
        echo "$submission"
        id="$(jq -r '.id // empty' <<< "$submission" 2> /dev/null || true)"
        status="$(jq -r '.status // empty' <<< "$submission" 2> /dev/null || true)"
        if [ -z "$id" ]; then
          echo "::error::The submission to Apple's notary service failed. Check the NOTARY_API_* secrets."
          exit 1
        fi
        case "$status" in
          Accepted) ;;
          Invalid | Rejected)
            xcrun notarytool log "$id" "${credentials[@]}" || true
            echo "::error::Apple did not notarize $SUBJECT (status: $status)."
            exit 1
            ;;
          *)
            echo "::error::Apple is still processing submission $id after an hour. Rerun the job later."
            exit 1
            ;;
        esac
