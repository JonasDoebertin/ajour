name: Build
description: Builds the app for release and zips it with ditto, which keeps the bundle's permissions and links intact.

inputs:
  version:
    description: Version shown to users; empty keeps the project's version
    default: ""
  build-number:
    description: Build number of the bundle
    required: true
  archive-name:
    description: File name of the zip, without extension
    required: true
  team-id:
    description: Team whose Developer ID signs the app; empty keeps the ad-hoc signature
    default: ""

outputs:
  app:
    description: Path of the built app
    value: ${{ steps.build.outputs.app }}
  archive:
    description: Path of the zipped app
    value: ${{ steps.archive.outputs.path }}

runs:
  using: composite
  steps:
    - name: Build the app
      id: build
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        TEAM_ID: ${{ inputs.team-id }}
      run: |
        settings=("CURRENT_PROJECT_VERSION=$BUILD_NUMBER")
        if [ -n "$VERSION" ]; then settings+=("MARKETING_VERSION=$VERSION"); fi
        if [ -n "$TEAM_ID" ]; then
          settings+=(
            "CODE_SIGN_IDENTITY=Developer ID Application"
            "DEVELOPMENT_TEAM=$TEAM_ID"
            "OTHER_CODE_SIGN_FLAGS=--timestamp"
            "CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO"
          )
        fi
        xcodebuild build \
          -project Ajour.xcodeproj \
          -scheme Ajour \
          -configuration Release \
          -destination "generic/platform=macOS" \
          -derivedDataPath build/DerivedData \
          "${settings[@]}" \
          | xcbeautify --renderer github-actions
        echo "app=build/DerivedData/Build/Products/Release/Ajour.app" >> "$GITHUB_OUTPUT"

    - name: Zip the app
      id: archive
      shell: bash
      env:
        APP: ${{ steps.build.outputs.app }}
        ARCHIVE_NAME: ${{ inputs.archive-name }}
      run: |
        path="build/$ARCHIVE_NAME.zip"
        ditto -c -k --keepParent "$APP" "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"
